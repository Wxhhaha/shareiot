let current=0,tab='matrix',sim='normal';

function nav(){document.getElementById('navs').innerHTML=domains.map(d=>`<button class="nav ${d.id===current?'on':''}" onclick="openDomain(${d.id})"><i>${String(d.id).padStart(2,'0')}</i>${d.title}</button>`).join('')}
function openDomain(id){current=id;tab=id===0?'overview':'matrix';document.getElementById('title').textContent=domains[id].title;document.getElementById('subtitle').textContent=domains[id].sub;nav();render()}
function render(){if(current===0)return renderOverview();document.getElementById('content').innerHTML=`<div class="tabs"><button class="tab ${tab==='matrix'?'on':''}" onclick="setTab('matrix')">竞品矩阵</button><button class="tab ${tab==='prototype'?'on':''}" onclick="setTab('prototype')">统一复刻</button><button class="tab ${tab==='flow'?'on':''}" onclick="setTab('flow')">流程与异常</button><button class="tab ${tab==='fields'?'on':''}" onclick="setTab('fields')">字段字典</button></div><div id="panel"></div>`;renderPanel()}
function setTab(t){tab=t;render()}
function renderOverview(){document.getElementById('content').innerHTML=`<div class="grid g4"><div class="card stat"><span class="muted sm">主竞品</span><b>6</b><span class="chip ok">上架App</span></div><div class="card stat"><span class="muted sm">功能域</span><b>16</b><span class="chip ok">全部完成</span></div><div class="card stat"><span class="muted sm">对比功能项</span><b>${Object.values(rows).reduce((a,b)=>a+b.length,0)}</b><span class="chip">逐项矩阵</span></div><div class="card stat"><span class="muted sm">异常场景</span><b>${Object.values(exceptions).reduce((a,b)=>a+b.length,0)}</b><span class="chip warn">可模拟</span></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>分析方法</h2><div class="list"><div class="item"><b>1. 功能存在性</b><div class="muted sm">明确车型、地区、订阅、硬件和版本边界。</div></div><div class="item"><b>2. 完整操作闭环</b><div class="muted sm">入口、校验、执行、ACK、结果、恢复和审计。</div></div><div class="item"><b>3. 中性UI复刻</b><div class="muted sm">不复制品牌视觉，只复刻功能逻辑和状态。</div></div><div class="item"><b>4. 数据可信度</b><div class="muted sm">所有实时值标明来源、时间和质量。</div></div></div></div><div class="card"><h2>16个功能域</h2><div class="grid g2">${domains.slice(1).map(d=>`<button class="btn" onclick="openDomain(${d.id})">${String(d.id).padStart(2,'0')} · ${d.title}</button>`).join('')}</div></div></div>`}
function renderPanel(){const p=document.getElementById('panel');if(tab==='matrix'){p.innerHTML=matrixHTML();renderMatrix()}else if(tab==='prototype')p.innerHTML=prototypeHTML();else if(tab==='flow')p.innerHTML=flowHTML();else p.innerHTML=fieldsHTML()}
function matrixHTML(){return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>${domains[current].title} · 六家竞品逐项矩阵</h2><div class="muted sm">绿色为明确/完整，黄色为车型、地区、订阅或版本限制。</div></div></div><div class="table"><table id="matrix"><thead><tr><th>功能项</th>${brands.map(b=>`<th data-brand="${b}">${b}</th>`).join('')}<th>统一复刻要求</th></tr></thead><tbody></tbody></table></div></div>`}
function renderMatrix(){if(!document.querySelector('#matrix tbody'))return;const q=(document.getElementById('search').value||'').toLowerCase(),b=document.getElementById('brand').value;let data=rows[current]||[];document.querySelector('#matrix tbody').innerHTML=data.filter(r=>r.join(' ').toLowerCase().includes(q)).map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1,7).map((v,i)=>`<td data-brand="${brands[i]}" class="${cls(v)}">${v}</td>`).join('')}<td>${r[7]}</td></tr>`).join('');document.querySelectorAll('[data-brand]').forEach(el=>el.classList.toggle('hide',b!=='all'&&el.dataset.brand!==b))}
function prototypeHTML(){const r=rows[current]||[];return `<div class="proto"><div class="phone"><div class="phonehead"><b>${domains[current].title}</b><span class="chip ok" id="simBadge">在线</span></div><div class="phonebody"><div class="hero"><div class="muted sm">统一功能对象</div><div class="big" id="heroValue">${r[0]?.[0]||'功能中心'}</div><div class="meter"><span id="bar"></span></div><div class="sm muted" id="fresh">数据更新于刚刚 · 来源可信</div></div><div class="fieldgrid" style="margin-top:10px">${r.slice(0,6).map((x,i)=>`<div class="field"><span>${x[0]}</span><b id="v${i}">${i%2?'正常':'已启用'}</b></div>`).join('')}</div><div class="actions">${r.slice(0,6).map((x,i)=>`<button onclick="doAction(${i})">${x[0]}</button>`).join('')}</div><div class="notice" id="notice">当前状态正常，可以继续操作。</div></div></div><div class="card"><h2>统一复刻说明</h2><div class="list"><div class="item"><b>对象与身份</b><div class="sm muted">当前车辆、用户角色、车型能力、地区和订阅必须先确定。</div></div><div class="item"><b>前置校验</b><div class="sm muted">连接、车辆状态、权限、安全、法规和冲突任务。</div></div><div class="item"><b>执行闭环</b><div class="sm muted">请求ID、设备ACK、实际反馈、结果核验和审计。</div></div><div class="item"><b>失败恢复</b><div class="sm muted">重试、排队、回滚、人工处理和门店恢复。</div></div></div><h2 style="margin-top:15px">状态模拟</h2><div class="row"><button class="btn" onclick="setSim('normal')">正常</button><button class="btn" onclick="setSim('offline')">离线</button><button class="btn" onclick="setSim('restricted')">权限受限</button><button class="btn" onclick="setSim('error')">执行失败</button></div><div class="card" style="margin-top:12px"><h3>本功能域必须覆盖</h3><div class="sm muted">${r.map(x=>x[0]).join('、')}</div></div></div></div>`}
function setSim(s){sim=s;const cfg={normal:['在线','当前状态正常，可以继续操作。','72%'],offline:['离线','无法获取实时状态，显示最后已知值并禁止即时控制。','28%'],restricted:['权限受限','当前身份无权执行高风险操作，可查看但不可修改。','48%'],error:['执行失败','设备未返回预期反馈，已记录失败原因并提供恢复入口。','15%']}[s];document.getElementById('simBadge').textContent=cfg[0];document.getElementById('notice').textContent=cfg[1];document.getElementById('bar').style.width=cfg[2];document.getElementById('fresh').textContent=s==='normal'?'数据更新于刚刚 · 来源可信':'数据质量：'+cfg[0]}
function doAction(i){const e=(exceptions[current]||[])[i%(exceptions[current]||['操作失败']).length];document.getElementById('notice').textContent=sim==='normal'?`“${(rows[current]||[])[i]?.[0]}”已进入前置校验，执行完成后将核验实际状态。`:`模拟异常：${e}。系统已阻止错误结果写入并提供恢复入口。`}
function flowHTML(){let ex=exceptions[current]||[];return `<div class="card"><h2>统一业务流程</h2><div class="flow"><div class="step"><strong>1. 选择对象</strong><p>确认车辆、账号、任务或订单。</p></div><div class="step"><strong>2. 能力判断</strong><p>车型、地区、订阅和硬件支持。</p></div><div class="step"><strong>3. 权限与安全</strong><p>角色、强认证、车辆状态和法规。</p></div><div class="step"><strong>4. 执行任务</strong><p>生成幂等ID并通过正确链路下发。</p></div><div class="step"><strong>5. 结果核验</strong><p>ACK、传感器反馈和云端状态一致。</p></div><div class="step"><strong>6. 证据与恢复</strong><p>审计、重试、回滚、工单和人工处理。</p></div></div></div><div class="card" style="margin-top:14px"><h2>异常场景</h2><div class="grid g3">${ex.map((x,i)=>`<div class="item"><b>${x}</b><div class="sm muted">${i<2?'强阻断：禁止继续并提示恢复。':i<4?'可恢复：保存上下文并允许重试。':'人工处理：生成证据和工单。'}</div><button class="btn" style="margin-top:7px" onclick="alert('已模拟：${x}；流程进入异常恢复分支。')">模拟</button></div>`).join('')}</div></div>`}
function fieldsHTML(){let fs=fields[current]||[];return `<div class="grid g4"><div class="card stat"><span class="muted sm">核心字段</span><b>${fs.length}</b><span class="chip ok">统一命名</span></div><div class="card stat"><span class="muted sm">必备元数据</span><b>5</b><span class="chip">来源/时间/质量</span></div><div class="card stat"><span class="muted sm">状态层级</span><b>4</b><span class="chip warn">对象/任务/结果/审计</span></div><div class="card stat"><span class="muted sm">敏感字段</span><b>受控</b><span class="chip bad">最小权限</span></div></div><div class="card" style="margin-top:14px"><h2>字段字典</h2><div class="table"><table><thead><tr><th>字段</th><th>中文含义</th><th>数据来源</th><th>有效性规则</th><th>展示与操作要求</th></tr></thead><tbody>${fs.map((f,i)=>`<tr><td>${f}</td><td>${(rows[current]||[])[i%(rows[current]||[]).length]?.[0]||'业务字段'}</td><td>${i%3===0?'车辆/设备':i%3===1?'App/用户':'云端/第三方'}</td><td>必须带 sampled_at、received_at、quality</td><td>${i%2?'只读展示，支持下钻':'参与流程校验，变更需审计'}</td></tr>`).join('')}</tbody></table></div></div>`}
function exportCSV(){if(current===0){alert('请选择功能域');return}let data=rows[current]||[],csv=[['功能项',...brands,'统一复刻要求'],...data].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=domains[current].title+'.csv';a.click();URL.revokeObjectURL(a.href)}
function exportJSON(){let payload={generated_at:new Date().toISOString(),brands,domains:domains.slice(1).map(d=>({id:d.id,title:d.title,subtitle:d.sub,comparison:rows[d.id],exceptions:exceptions[d.id],fields:fields[d.id]}))},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='竞品APP功能完整解析.json';a.click();URL.revokeObjectURL(a.href)}
nav();render();
